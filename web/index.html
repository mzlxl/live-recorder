<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>直播录制系统</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="topbar">
        <div class="brand">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="12" r="10"></circle>
                <polyline points="8 12 12 15 16 9"></polyline>
            </svg>
            <span>直播录制系统</span>
        </div>
        <nav class="menu">
            <button class="tab active" data-tab="dashboard">录制看板</button>
            <button class="tab" data-tab="tasks">任务列表</button>
            <button class="tab" data-tab="recordings">录制产物</button>
        </nav>
        <div id="status-bar" class="statusbar">加载中…</div>
    </header>

    <main>
        <!-- 录制看板 -->
        <section id="page-dashboard">
            <div class="cards" id="stat-cards"></div>

            <div class="panel">
                <div class="panel-head">
                    <h3>正在录制</h3>
                </div>
                <div id="running-list" class="running-list"></div>
            </div>

            <div class="panel">
                <div class="panel-head">
                    <h3>今日产物</h3>
                    <button class="btn ghost sm btn-viewall" onclick="switchTab('recordings')">查看全部</button>
                </div>
                <div class="table-wrap">
                    <table class="data-table">
                        <thead>
                            <tr><th>任务</th><th>开始</th><th>时长</th><th>大小</th><th>状态</th><th>操作</th></tr>
                        </thead>
                        <tbody id="dash-recent"></tbody>
                    </table>
                </div>
            </div>
        </section>

        <!-- 任务列表 -->
        <section id="page-tasks" class="hidden">
            <div class="panel-head">
                <h3>任务管理</h3>
                <button class="btn primary btn-add" id="btn-add">新增任务</button>
            </div>

            <div id="task-form" class="panel hidden">
                <input type="hidden" id="f-id">
                <div class="form-grid">
                    <div class="form-row"><label>任务名 *</label><input id="f-name" placeholder="如：企智AI直播"></div>
                    <div class="form-row"><label>平台</label><div id="f-platform" class="field-control"></div></div>
                    <div class="form-row"><label>主播主页 *</label><input id="f-home" placeholder="https://www.douyin.com/user/xxxx"></div>
                    <div class="form-row"><label>主播名</label><input id="f-anchor" placeholder="展示用（可选）"></div>
                    <div class="form-row">
                        <label>检查频率 *</label>
                        <div class="field-stack">
                            <div id="f-frequency" class="field-control"></div>
                            <span class="field-hint">仅在扫描时段内触发检查</span>
                        </div>
                    </div>
                    <div class="form-row">
                        <label>扫描时段</label>
                        <div class="field-stack">
                            <div class="time-range">
                                <div id="f-scan-start" class="field-control"></div>
                                <span class="time-sep">至</span>
                                <div id="f-scan-end" class="field-control"></div>
                            </div>
                            <span class="field-hint">仅选择时、分；结束时间可早于开始时间，表示跨至次日（如 22:00 至 01:00）</span>
                        </div>
                    </div>
                </div>
                <div class="form-actions">
                    <button class="btn primary" onclick="saveTask()">保存</button>
                    <button class="btn" onclick="hideForm()">取消</button>
                </div>
            </div>

            <div class="table-wrap">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>ID</th><th>任务名</th><th>平台</th><th>主播</th><th>检查频率</th>
                            <th>扫描时段</th><th>状态</th><th>产物数</th><th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="task-tbody"></tbody>
                </table>
            </div>
        </section>

        <!-- 录制产物 -->
        <section id="page-recordings" class="hidden">
            <div class="panel-head">
                <h3>录制产物</h3>
                <div class="toolbar">
                    <div id="filter-task" class="field-control"></div>
                    <button class="btn ghost" onclick="openFolder()">打开产物文件夹</button>
                    <button class="btn ghost" onclick="loadRecordings()">刷新</button>
                </div>
            </div>
            <div class="table-wrap">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>ID</th><th>任务</th><th>开始</th><th>结束</th><th>时长</th>
                            <th>大小</th><th>状态</th><th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="recording-tbody"></tbody>
                </table>
            </div>
        </section>
    </main>

    <div id="toast" class="toast hidden"></div>
    <script src="app.js"></script>
</body>
</html>
