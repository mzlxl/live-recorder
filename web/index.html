<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f4f6fa" />
    <title>声序 · 直播录制工作台</title>
    <link rel="stylesheet" href="style.css?v=controls-2" />
  </head>
  <body>
    <a class="skip" href="#main">跳至内容</a>
    <header class="appbar">
      <a class="brand" href="#tasks" aria-label="声序工作台"
        ><span class="brand-mark"><i data-icon="audio"></i></span>声序</a
      >
      <nav aria-label="工作台导航">
        <a href="#tasks" data-tab="tasks"><i data-icon="tasks"></i>工作台</a>
        <a href="#recordings" data-tab="recordings"><i data-icon="library"></i>录音库</a>
        <a href="#dashboard" data-tab="dashboard"><i data-icon="dashboard"></i>总览</a>
      </nav>
      <button class="primary" id="btn-add"><i data-icon="plus"></i>新建任务</button>
    </header>
    <main tabindex="-1" id="main">
      <p id="load-error" role="alert" hidden></p>
      <section id="page-dashboard" class="collection" hidden>
        <header class="collection-head">
          <small id="page-date"></small>
          <h1>录制总览</h1>
        </header>
        <div class="monitor">
          <div class="monitor-copy">
            <div class="monitor-label"><i data-icon="radio"></i>实时监听</div>
            <div id="running-list">正在读取任务…</div>
          </div>
          <div class="meter" aria-hidden="true"></div>
        </div>
        <div class="metrics" id="stat-cards"></div>
        <div class="panel">
          <div class="panel-head">
            <h2>最近录音</h2>
            <a href="#recordings">进入资料库 →</a>
          </div>
          <div id="dash-recent"></div>
        </div>
      </section>
      <section id="page-tasks" class="workspace">
        <aside class="sidebar" aria-label="选择录制任务">
          <div class="side-head">
            <h2>录制任务</h2>
            <span class="meta" id="task-count"></span>
          </div>
          <div class="task-search">
            <i data-icon="search"></i>
            <input type="search" id="task-search" aria-label="查找任务" placeholder="查找任务" />
            <button type="button" id="clear-search" aria-label="清空任务搜索" hidden>
              <i data-icon="close"></i>
            </button>
          </div>
          <div id="task-list"></div>
          <div class="system">
            <span class="dot"></span><span id="status-bar">正在连接设备…</span>
          </div>
        </aside>
        <div class="detail">
          <div id="task-empty" hidden></div>
          <div id="task-detail" hidden>
            <small class="crumb">工作台　/　录制任务</small>
            <header class="task-head">
              <div>
                <h1 id="task-title"></h1>
                <p class="meta" id="task-meta"></p>
              </div>
              <div id="task-actions" class="actions"></div>
            </header>
            <p class="last-result" id="task-result" hidden></p>
            <div class="history">
              <label for="task-record">任务录音 <span id="record-count"></span></label
              ><button
                type="button"
                class="choice"
                id="task-record"
                aria-label="选择任务录音"
              ></button>
            </div>
            <div id="inline-reader"></div>
            <div id="record-empty" hidden></div>
          </div>
        </div>
      </section>
      <section id="page-recordings" class="collection" hidden>
        <header class="collection-head">
          <small>工作空间　/　资料库</small>
          <h1>录音与文稿</h1>
        </header>
        <div class="panel">
          <div class="panel-head">
            <h2>录音资料库</h2>
            <div class="toolbar">
              <label class="sr" for="filter-task">按任务筛选</label
              ><button type="button" class="choice" id="filter-task" aria-label="按任务筛选">
                全部任务</button
              ><button data-action="folder">打开目录</button
              ><button data-action="refresh" aria-label="刷新资料库">
                <i data-icon="refresh"></i>
              </button>
            </div>
          </div>
          <div id="recording-list"></div>
        </div>
      </section>
    </main>
    <dialog id="editor" aria-labelledby="editor-title">
      <form id="task-form" novalidate>
        <header>
          <h2 id="editor-title">新建任务</h2>
          <button type="button" class="close" data-close aria-label="关闭">
            <i data-icon="close"></i>
          </button>
        </header>
        <div class="form-body">
          <label>任务名称<input id="f-name" required maxlength="160" autofocus /></label>
          <label
            >主播主页<input
              id="f-home"
              type="url"
              placeholder="https://www.douyin.com/user/…"
              required
          /></label>
          <div class="pair">
            <div class="field">
              <label for="f-platform">直播平台</label
              ><button type="button" class="choice" id="f-platform"></button>
            </div>
            <label>主播名称（选填）<input id="f-anchor" /></label>
          </div>
          <div class="field">
            <label for="f-frequency">检查频率</label
            ><button type="button" class="choice" id="f-frequency"></button>
          </div>
          <fieldset>
            <legend>扫描时段</legend>
            <div class="pair">
              <div class="field">
                <span id="start-label">开始</span>
                <div
                  class="clock-field"
                  id="f-scan-start"
                  role="group"
                  aria-labelledby="start-label"
                ></div>
              </div>
              <div class="field">
                <span id="end-label">结束</span>
                <div
                  class="clock-field"
                  id="f-scan-end"
                  role="group"
                  aria-labelledby="end-label"
                ></div>
              </div>
            </div>
            <small>留空表示不限。结束时间早于开始时间时，扫描至次日。</small>
          </fieldset>
          <p id="form-error" class="error" role="alert" hidden></p>
        </div>
        <footer>
          <button type="button" data-close>取消</button
          ><button class="primary" type="submit">保存任务</button>
        </footer>
      </form>
    </dialog>
    <dialog id="confirm-dialog" aria-labelledby="confirm-title" aria-describedby="confirm-message">
      <form method="dialog">
        <header>
          <h2 id="confirm-title"></h2>
          <button type="button" class="close" data-close aria-label="关闭">
            <i data-icon="close"></i>
          </button>
        </header>
        <div class="form-body">
          <p id="confirm-message"></p>
          <label class="check" hidden
            ><input id="delete-files" type="checkbox" />同时删除本地音频文件</label
          >
        </div>
        <footer>
          <button value="cancel" autofocus>取消</button
          ><button class="danger" value="confirm" id="confirm-submit">确认</button>
        </footer>
      </form>
    </dialog>
    <dialog id="reader" aria-labelledby="reader-title">
      <header>
        <div>
          <small>录音详情</small>
          <h2 id="reader-title">录音与文稿</h2>
        </div>
        <button data-close class="close" aria-label="关闭"><i data-icon="close"></i></button>
      </header>
      <div id="reader-home">
        <div class="reading" id="reader-content">
          <div class="audio-panel" id="audio-panel">
            <div class="player-head">
              <strong>录音回听</strong>
              <canvas
                id="speech-map"
                width="460"
                height="30"
                role="img"
                aria-label="已识别语句在录音中的分布"
                hidden
              ></canvas>
            </div>
            <audio preload="metadata" id="player"></audio>
            <div class="transport">
              <button type="button" id="play-audio" aria-label="播放录音">
                <i data-icon="play"></i>
              </button>
              <span class="elapsed" id="play-time">00:00</span>
              <input
                type="range"
                id="play-position"
                aria-label="播放进度"
                min="0"
                max="0"
                step="0.1"
                value="0"
                disabled
              />
              <span id="play-duration">00:00</span>
              <button type="button" id="mute" aria-label="静音" aria-pressed="false">
                <i data-icon="volume"></i>
              </button>
              <input
                type="range"
                id="volume"
                min="0"
                max="1"
                step="0.05"
                value="1"
                aria-label="音量"
              />
              <button type="button" id="speed" class="choice" aria-label="播放速度"></button>
            </div>
          </div>
          <div id="record-meta" class="meta"></div>
          <div id="file-actions" class="toolbar"></div>
          <section class="manuscript" aria-label="转写文稿">
            <div class="manuscript-head">
              <h3>转写文稿</h3>
              <div id="reader-tools" class="toolbar" hidden>
                <div class="mode-switch" role="group" aria-label="文稿阅读方式">
                  <button id="paragraph-view" type="button" aria-pressed="true">分段阅读</button>
                  <button id="sentence-view" type="button" aria-pressed="false">逐句回听</button>
                </div>
                <button id="copy-text" type="button">复制全文</button>
              </div>
            </div>
            <div id="transcript-status" role="status"></div>
            <progress id="asr-progress" aria-label="正在识别语音" hidden></progress>
            <div id="transcript-body"></div>
          </section>
        </div>
      </div>
    </dialog>
    <div class="toast" id="toast" role="status"></div>
    <script src="controls.js?v=controls-2"></script>
    <script src="app.js?v=controls-2"></script>
  </body>
</html>
