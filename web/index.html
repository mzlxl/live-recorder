<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#102c32" />
    <title>声序 · 直播录制工作台</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <a class="skip" href="#main">跳至内容</a>
    <aside class="rail">
      <div class="brand">
        <b class="brand-mark" aria-hidden="true">∿</b>
        <div>声序<small>直播录制工作台</small></div>
      </div>
      <nav aria-label="工作台导航">
        <a href="#dashboard" data-tab="dashboard"><i data-icon="dashboard"></i>录制总览</a>
        <a href="#tasks" data-tab="tasks"><i data-icon="tasks"></i>录制任务</a>
        <a href="#recordings" data-tab="recordings"><i data-icon="library"></i>录音与文稿</a>
      </nav>
      <div class="system"><span class="dot"></span><span id="status-bar">正在连接采集设备…</span></div>
    </aside>
    <main tabindex="-1" id="main">
      <header class="page-head">
        <div>
          <div id="page-date"></div>
          <h1 id="page-title">录制总览</h1>
        </div>
        <button class="primary" id="btn-add"><i data-icon="plus"></i>新建任务</button>
      </header>
      <p id="load-error" role="alert" hidden></p>
      <section id="page-dashboard">
        <div class="monitor">
          <div class="monitor-copy">
            <div class="monitor-label"><i data-icon="radio"></i>实时监听</div>
            <div id="running-list">正在读取任务…</div>
          </div>
          <div class="meter" aria-hidden="true"></div>
        </div>
        <div class="metrics" id="stat-cards"></div>
        <div class="panel">
          <div class="panel-head">
            <h2>最近录音</h2>
            <a href="#recordings">进入资料库 →</a>
          </div>
          <div id="dash-recent"></div>
        </div>
      </section>
      <section id="page-tasks" hidden>
        <div class="panel">
          <div class="panel-head">
            <h2>任务列表</h2>
            <span class="meta" id="task-count"></span>
          </div>
          <div id="task-list"></div>
        </div>
      </section>
      <section id="page-recordings" hidden>
        <div class="panel">
          <div class="panel-head">
            <h2>录音资料库</h2>
            <div class="toolbar">
              <label class="sr" for="filter-task">按任务筛选</label
              ><select id="filter-task">
                <option value="">全部任务</option></select
              ><button data-action="folder">打开目录</button
              ><button data-action="refresh" aria-label="刷新资料库"><i data-icon="refresh"></i></button>
            </div>
          </div>
          <div id="recording-list"></div>
        </div>
      </section>
    </main>
    <dialog id="editor" aria-labelledby="editor-title">
      <form id="task-form">
        <header>
          <h2 id="editor-title">新建任务</h2>
          <button type="button" class="close" data-close aria-label="关闭">
            <i data-icon="close"></i>
          </button>
        </header>
        <div class="form-body">
          <label>任务名称<input id="f-name" required maxlength="160" autofocus /></label>
          <label
            >主播主页<input id="f-home" type="url" placeholder="https://www.douyin.com/user/…" required
          /></label>
          <div class="pair">
            <label>直播平台<select id="f-platform" required></select></label
            ><label>主播名称（选填）<input id="f-anchor" /></label>
          </div>
          <label>检查频率<select id="f-frequency" required></select></label>
          <fieldset>
            <legend>扫描时段</legend>
            <div class="pair">
              <label>开始<input id="f-scan-start" type="time" /></label
              ><label>结束<input id="f-scan-end" type="time" /></label>
            </div>
            <small>留空表示不限。结束时间早于开始时间时，扫描至次日。</small>
          </fieldset>
          <p id="form-error" class="error" role="alert" hidden></p>
        </div>
        <footer>
          <button type="button" data-close>取消</button
          ><button class="primary" type="submit">保存任务</button>
        </footer>
      </form>
    </dialog>
    <dialog id="confirm-dialog" aria-labelledby="confirm-title">
      <form method="dialog">
        <header><h2 id="confirm-title"></h2></header>
        <div class="form-body">
          <p id="confirm-message"></p>
          <label class="check" hidden
            ><input id="delete-files" type="checkbox" />同时删除本地音频文件</label
          >
        </div>
        <footer>
          <button value="cancel" autofocus>取消</button
          ><button class="danger" value="confirm" id="confirm-submit">确认</button>
        </footer>
      </form>
    </dialog>
    <dialog id="reader" aria-labelledby="reader-title">
      <header>
        <div>
          <small>录音详情</small>
          <h2 id="reader-title">录音与文稿</h2>
        </div>
        <button data-close class="close" aria-label="关闭"><i data-icon="close"></i></button>
      </header>
      <div class="form-body">
        <div id="record-meta" class="meta"></div>
        <audio controls preload="metadata" id="player"></audio>
        <div id="file-actions" class="toolbar"></div>
        <div class="manuscript">
          <h3>转写文稿</h3>
          <div id="transcript-status" role="status"></div>
          <progress id="asr-progress" aria-label="正在识别语音" hidden></progress>
          <div id="reader-tools" class="toolbar" hidden>
            <button id="sentence-view" type="button" aria-pressed="false">逐句回听</button>
            <button id="copy-text" type="button">复制全文</button>
          </div>
          <div id="transcript-body"></div>
        </div>
      </div>
    </dialog>
    <div class="toast" id="toast" role="status"></div>
    <script src="app.js"></script>
  </body>
</html>
